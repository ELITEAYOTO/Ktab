# ============================================================
# Ktab — Configuration
# ============================================================

enabled: true

update_interval_ticks: 40
placeholderapi: true

header:
  - "&6&lVOLKARIA"
  - "&7Bienvenue &f%player_name%"

footer:
  - ""
  - "&7Métier: &f%kjob_display_job_name%"
  - "&7Niveau global: &e%kjob_global_level%"
  - "&7Quêtes à récupérer: &a%kjob_claimable_quests%"

player_list_name:
  enabled: false
  format: "&7%player_name%"
  max_length: 16

# ============================================================
# VISIBILITÉ DES ENTRÉES VANILLA / NPC
# ============================================================
#
# IMPORTANT :
# ces options retirent uniquement les entrées du PlayerInfo/TAB.
# Elles ne rendent PAS les joueurs ou NPC invisibles dans le monde.
#
visibility:

  # Recommandé avec le layout virtuel.
  # Empêche les vrais pseudos de prendre une cellule et de décaler les colonnes.
  hide_real_players: true

  # Hook optionnel sur le plugin "ServerNPC".
  # Ktab lit ServerNPC.getAPI().getNPCList() puis retire leurs UUID du TAB.
  hide_servernpc: true

  # Laisse vanilla + ServerNPC terminer leur séquence de spawn/skin avant
  # d'appliquer le premier nettoyage du TAB au join.
  initial_hide_delay_ticks: 20

# ============================================================
# LAYOUT VIRTUEL
# ============================================================

virtual_layout:
  enabled: true

  update_interval_ticks: 40

  columns_count: 3
  rows: 15

  # Avec hide_real_players=true, la place des joueurs réels n'est plus réservée.
  max_entries: 45
  reserve_real_entries: 1
  force_client_rows: true

  ordering:
    technical_name_prefix: "!kt_"
    stable_uuid_seed: "volkaria-ktab"
    start_index: 1

  render:
    # §8 directement plutôt que "&8" : les entrées de remplissage ne sont
    # pas rerendues une deuxième fois après leur insertion.
    blank_text: "§8"
    cell_prefix: ""
    cell_suffix: ""

  columns:

    infos:
      enabled: true
      title: "&6&lVOLKARIA"
      lines:
        - text: "&7Joueur: &f%player_name%"
          skin: "viewer"

        - "&7Métier: &e%kjob_display_job_name%"
        - "&7Niveau global: &e%kjob_global_level%"
        - ""
        - "&7Slots: &f%kjob_slots_used%&8/&f%kjob_slots_unlocked%"
        - "&7Quêtes: &a%kjob_claimable_quests%"

    jobs:
      enabled: true
      title: "&e&lMÉTIERS"
      lines:
        - "&7Mineur: &fNv.%kjob_level_mineur%"
        - "&7Farmer: &fNv.%kjob_level_farmer%"
        - "&7Chasseur: &fNv.%kjob_level_hunter%"
        - "&7Prétorien: &fNv.%kjob_level_pretorien%"
        - "&7Artisan: &fNv.%kjob_level_artisan%"
        - "&7Pilleur: &fNv.%kjob_level_pilleur%"

    server:
      enabled: true
      title: "&b&lSERVEUR"
      lines:
        - "&7En ligne: &f%server_online%"
        - "&7Ping: &f%player_ping%ms"
        - ""
        - "&7www.volkaria.fr"
